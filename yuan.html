<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>跳动的爱心</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      display: block;
      filter: drop-shadow(0 0 30px rgba(255, 138, 180, 0.3));
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>
  <script>
    const xScreen = 1200;
    const yScreen = 800;
    const PI = Math.PI;
    const E = Math.E;
    const averageDistance = 0.162;
    const quantity = 506;
    const circles = 210;
    const frames = 20;

    const colors = [
      'rgb(255,138,180)',
      'rgb(252,145,196)',
      'rgb(255,144,194)',
      'rgb(255,144,194)',
      'rgb(255,143,195)',
      'rgb(255,140,190)',
      'rgb(255,142,193)'
    ];

    function getRandomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function parseColor(colorStr) {
      const r = parseInt(colorStr.slice(4, colorStr.indexOf(',')));
      const g = parseInt(colorStr.slice(colorStr.indexOf(',') + 1, colorStr.lastIndexOf(',')));
      const b = parseInt(colorStr.slice(colorStr.lastIndexOf(',') + 1, -1));
      return { r, g, b };
    }

    function rgbToString(r, g, b) {
      return `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
    }

    function rgbaToString(r, g, b, a) {
      return `rgba(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)},${a})`;
    }

    function darkenColor(colorStr, factor) {
      const { r, g, b } = parseColor(colorStr);
      return rgbToString(r / factor, g / factor, b / factor);
    }

    function lightenColor(colorStr, factor) {
      const { r, g, b } = parseColor(colorStr);
      return rgbToString(Math.min(255, r * factor), Math.min(255, g * factor), Math.min(255, b * factor));
    }

    function screenX(x) {
      return x + xScreen / 2;
    }
    function screenY(y) {
      return -y + yScreen / 2;
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    const originPoints = [];
    let t = 0.1;
    let index = 0;
    let x1 = 0, y1 = 0;

    while (t <= 2 * PI) {
      const x2 = 16 * Math.pow(Math.sin(t), 3);
      const y2 = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

      const dx = x2 - x1, dy = y2 - y1;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist >= averageDistance) {
        x1 = x2; y1 = y2;
        originPoints[index++] = { x: x2, y: y2 };
        if (index >= quantity) break;
      }
      t += 0.005;
    }

    const points = [];
    let pointIndex = 0;
    for (let size = 0.1, lightness = 1.5; size <= 20; size += 0.1) {
      const successP = 1 / (1 + Math.pow(E, 8 - size / 2));
      if (lightness > 1) lightness -= 0.0025;

      for (let i = 0; i < originPoints.length; i++) {
        if (Math.random() < successP) {
          const color = getRandomColor();
          const depth = size / 20;
          points[pointIndex] = {
            x: size * originPoints[i].x + randomInt(-4, 4),
            y: size * originPoints[i].y + randomInt(-4, 4),
            color: darkenColor(color, lightness),
            depth: depth,
            size: size
          };
          pointIndex++;
        }
      }
    }

    const totalPoints = pointIndex;

    const ctx = document.createElement('canvas').getContext('2d');
    ctx.canvas.width = xScreen;
    ctx.canvas.height = yScreen;
    const frameImages = new Array(frames);

    for (let frame = 0; frame < frames; frame++) {
      const offscreen = document.createElement('canvas');
      offscreen.width = xScreen;
      offscreen.height = yScreen;
      const c = offscreen.getContext('2d');
      c.fillStyle = 'rgba(10, 10, 30, 1)';
      c.fillRect(0, 0, xScreen, yScreen);

      c.save();
      c.shadowColor = 'rgba(255, 138, 180, 0.8)';
      c.shadowBlur = 20;
      c.shadowOffsetX = 10;
      c.shadowOffsetY = 10;

      let tempPoints = JSON.parse(JSON.stringify(points));
      for (let i = 0; i < totalPoints; i++) {
        const x = tempPoints[i].x;
        const y = tempPoints[i].y;
        const dist = Math.sqrt(x * x + y * y);
        const increase = (-0.0009 * dist * dist + 0.35714 * dist + 5) / frames;
        const dx = (x / dist) * increase * frame;
        const dy = (y / dist) * increase * frame;

        const nx = x + dx;
        const ny = y + dy;
        const depth = tempPoints[i].depth;

        const baseColor = parseColor(tempPoints[i].color);
        const shadowFactor = 0.6 + depth * 0.4;
        const shadowColor = rgbToString(baseColor.r * shadowFactor, baseColor.g * shadowFactor, baseColor.b * shadowFactor);

        c.fillStyle = shadowColor;
        c.globalAlpha = 0.3;
        c.beginPath();
        c.arc(screenX(nx) + 3 * depth, screenY(ny) + 3 * depth, 2 + depth, 0, PI * 2);
        c.fill();

        const gradient = c.createRadialGradient(
          screenX(nx) - depth, screenY(ny) - depth, 0,
          screenX(nx), screenY(ny), 3 + depth
        );
        const highlightColor = rgbaToString(255, 200, 220, 0.8);
        const midColor = rgbaToString(baseColor.r, baseColor.g, baseColor.b, 0.9);
        const edgeColor = rgbaToString(baseColor.r * 0.7, baseColor.g * 0.5, baseColor.b * 0.6, 0.6);

        gradient.addColorStop(0, highlightColor);
        gradient.addColorStop(0.4, midColor);
        gradient.addColorStop(1, edgeColor);

        c.fillStyle = gradient;
        c.globalAlpha = 0.8 + depth * 0.2;
        c.beginPath();
        c.arc(screenX(nx), screenY(ny), 2 + depth, 0, PI * 2);
        c.fill();

        c.globalAlpha = 0.3;
        const glowGradient = c.createRadialGradient(
          screenX(nx), screenY(ny), 0,
          screenX(nx), screenY(ny), 8 + depth * 4
        );
        glowGradient.addColorStop(0, rgbaToString(255, 138, 180, 0.4));
        glowGradient.addColorStop(0.5, rgbaToString(255, 100, 150, 0.1));
        glowGradient.addColorStop(1, 'rgba(255, 100, 150, 0)');
        c.fillStyle = glowGradient;
        c.beginPath();
        c.arc(screenX(nx), screenY(ny), 8 + depth * 4, 0, PI * 2);
        c.fill();
      }

      c.globalAlpha = 1;
      c.shadowBlur = 0;

      for (let size = 17; size <= 23; size += 0.3) {
        for (let i = 0; i < originPoints.length; i++) {
          const prob = size >= 20 ? 0.6 : 0.95;
          if (Math.random() > prob) {
            let offsetX, offsetY;
            if (size >= 20) {
              const jitter = frame * frame / 5 + 15;
              offsetX = randomInt(-jitter - 15, jitter + 15);
              offsetY = randomInt(-jitter - 15, jitter + 15);
            } else {
              offsetX = randomInt(-5, 5);
              offsetY = randomInt(-5, 5);
            }
            const x = originPoints[i].x * size + offsetX;
            const y = originPoints[i].y * size + offsetY;

            const color = getRandomColor();
            const gradient = c.createRadialGradient(
              screenX(x) - 1, screenY(y) - 1, 0,
              screenX(x), screenY(y), 3
            );
            gradient.addColorStop(0, 'rgba(255, 220, 240, 0.9)');
            gradient.addColorStop(0.5, color);
            gradient.addColorStop(1, 'rgba(200, 80, 130, 0.5)');

            c.fillStyle = gradient;
            c.beginPath();
            c.arc(screenX(x), screenY(y), 3, 0, PI * 2);
            c.fill();

            c.fillStyle = 'rgba(255, 255, 255, 0.6)';
            c.beginPath();
            c.arc(screenX(x) - 0.5, screenY(y) - 0.5, 1, 0, PI * 2);
            c.fill();
          }
        }
      }

      c.restore();

      frameImages[frame] = offscreen;
    }

    const canvas = document.getElementById('heartCanvas');
    const c = canvas.getContext('2d');
    canvas.width = xScreen;
    canvas.height = yScreen;

    let currentFrame = 0;
    let direction = 1;

    function animate() {
      c.clearRect(0, 0, xScreen, yScreen);
      
      c.save();
      c.filter = 'blur(2px)';
      c.globalAlpha = 0.3;
      c.drawImage(frameImages[currentFrame], 0, 0);
      c.restore();
      
      c.drawImage(frameImages[currentFrame], 0, 0);

      if (direction === 1) {
        currentFrame = currentFrame < frames - 1 ? currentFrame + 1 : (direction = -1, currentFrame - 1);
      } else {
        currentFrame = currentFrame > 0 ? currentFrame - 1 : (direction = 1, currentFrame + 1);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
